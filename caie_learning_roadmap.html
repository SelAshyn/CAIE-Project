let current = 0;

function render() {
  const nav = document.getElementById('phase-nav');
  nav.innerHTML = phases.map((p, i) =>
    `<button class="phase-btn ${i === current ? 'active' : ''}" onclick="goTo(${i})">${i+1}</button>`
  ).join('');

  document.getElementById('progress').style.width = ((current + 1) / phases.length * 100).toFixed(1) + '%';

  const container = document.getElementById('phases-container');
  const p = phases[current];

  container.innerHTML = `
    <div class="phase-card active">
      <div class="phase-header">
        <span class="phase-tag" style="background:${p.tagColor}22;color:${p.tagColor}">${p.tag}</span>
        ${p.youKnow ? '<span class="you-know">You already know some of this ✓</span>' : ''}
        <div class="phase-title">${p.title}</div>
        <div class="phase-sub">${p.sub}</div>
      </div>

      <div class="week-label">What you will learn</div>
      <div class="skills-grid" style="grid-template-columns: repeat(2, minmax(0,1fr))">
        ${p.skills.map((s, idx) => {
          const colors = ['blue', 'green', 'cyan', 'red', 'purple', 'orange', 'dark', 'pink'];
          const colorIdx = (p.id * 4 + idx) % colors.length;
          return `
          <div class="skill-card" data-color="${colors[colorIdx]}">
            <div class="sk-name">${s.name}</div>
            <div class="sk-desc">${s.desc}</div>
          </div>
        `;
        }).join('')}
      </div>

      <div class="resources-section">
        <div class="resources-title">Best free resources</div>
        <div class="resource-list">
          ${p.resources.map((r, i) => `
            <div class="resource-item">
              <div class="resource-dot" style="background:${p.tagColor}"></div>
              <div class="resource-text"><strong>${r.label}</strong> — ${r.note}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="deliverable-box">
        <div class="d-label">Deliverable — what you build this phase</div>
        <div class="d-text">${p.deliverable}</div>
      </div>

      <div class="advice-box">
        <div class="a-label">Real talk</div>
        <div class="a-text">${p.advice}</div>
      </div>

      <div class="nav-row">
        <button class="nav-btn" onclick="goTo(${current-1})" ${current === 0 ? 'disabled' : ''}>
          <i class="ti ti-arrow-left" aria-hidden="true"></i> Previous
        </button>
        <span class="page-indicator">${current + 1} of ${phases.length}</span>
        ${current < phases.length - 1
          ? `<button class="nav-btn primary" onclick="goTo(${current+1})">Next <i class="ti ti-arrow-right" aria-hidden="true"></i></button>`
          : `<button class="nav-btn primary" onclick="sendPrompt('Give me the code to start Phase 1 — Next.js 14 + TypeScript setup for the CAIE MCQ project')">Start building ↗</button>`
        }
      </div>
    </div>
  `;
}

function goTo(i) {
  if (i < 0 || i >= phases.length) return;
  current = i;
  render();
  window.scrollTo(0, 0);
}

// Theme toggle functionality
const themeToggle = document.getElementById('theme-toggle');
const isDarkMode = localStorage.getItem('dark-mode') === 'true' ||
                   window.matchMedia('(prefers-color-scheme: dark)').matches;

if (isDarkMode) {
  document.body.classList.add('dark-mode');
  themeToggle.textContent = '☀️';
}

themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  localStorage.setItem('dark-mode', isDark);
  themeToggle.textContent = isDark ? '☀️' : '🌙';
});

render();
</script>
